name: PlanHot
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['decisions/**', 'index.html', 'planhot.py', '.github/workflows/planhot.yml']
permissions: {}
jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[scan]')
    runs-on: ubuntu-latest
    concurrency: planhot-scan
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 planhot.py scan
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: planhot-publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 planhot.py render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
